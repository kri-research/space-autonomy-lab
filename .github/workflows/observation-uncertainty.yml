name: Observation uncertainty
on:
  pull_request:
    paths:
      - 'studies/information-aware-assurance-v1/**'
      - 'studies/README.md'
      - '.github/workflows/observation-uncertainty.yml'
  push:
    branches: [main]
    paths:
      - 'studies/information-aware-assurance-v1/**'
      - 'studies/README.md'
      - '.github/workflows/observation-uncertainty.yml'
permissions:
  contents: read
jobs:
  sa02:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Check historical preservation
        run: |
          python tools/check_release_preservation.py
          python tools/verify_historical_snapshots.py
      - name: Install isolated new-phase test tools
        run: python -m pip install -r studies/information-aware-assurance-v1/requirements-dev.txt
      - name: Check the reference loop and recorded fixtures
        working-directory: studies/information-aware-assurance-v1
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest -c pyproject.toml --confcutdir=. sa02_tests
          python -m sa02.artifact verify sa02/recorded --replay
          python -m iaa.artifact verify recorded_sa01_final
          git diff --exit-code
