name: Independent HCW verifier
on:
  pull_request:
    paths:
      - 'studies/property-alignment-v1/independent_hcw_audit_v1/**'
      - '.github/workflows/independent-hcw-audit.yml'
permissions:
  contents: read
jobs:
  independent-hcw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Test isolated implementation and exposed fixtures only
        working-directory: studies/property-alignment-v1
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -I -S -B independent_hcw_audit_v1/worker.py --selftest
          python -I -S -B independent_hcw_audit_v1/worker.py --calibrate
          python -m independent_hcw_audit_v1.protocol --verify independent_hcw_audit_v1/frozen/protocol.json --audit-id "$(python -c 'import json; print(json.load(open("independent_hcw_audit_v1/frozen/protocol.json"))["audit_id"])')"
          git diff --exit-code
