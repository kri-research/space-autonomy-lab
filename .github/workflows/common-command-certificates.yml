name: Common command certificate validation
on:
  pull_request:
    paths:
      - 'studies/property-alignment-v1/candidate/**'
      - '.github/workflows/common-command-certificates.yml'
permissions:
  contents: read
jobs:
  common-command-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Isolated dependencies and preserved historical evidence
        run: |
          python -m pip install -r studies/property-alignment-v1/protective/requirements.txt
          git clone --no-hardlinks . "$RUNNER_TEMP/sal-evidence"
          git -C "$RUNNER_TEMP/sal-evidence" checkout --detach 5539de5753092b09fd78351095292e7627047794
      - name: Analytical tests and read-only recorded-certificate verification
        working-directory: studies/property-alignment-v1
        run: |
          export SAL_EVIDENCE_ROOT="$RUNNER_TEMP/sal-evidence"
          export OPENBLAS_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1
          python -m pytest -c pyproject.toml --confcutdir=. candidate/tests protective/tests
          python -m candidate.artifact candidate/recorded_development
          python -m candidate.verification.replay candidate/recorded_development --output "$RUNNER_TEMP/candidate-fixed-input-revalidation"
          python -m protective.binding
          git -C "$SAL_EVIDENCE_ROOT" diff --exit-code
