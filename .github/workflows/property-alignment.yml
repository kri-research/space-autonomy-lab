name: Property alignment baseline
on:
  pull_request:
    paths:
      - 'studies/property-alignment-v1/**'
      - '.github/workflows/property-alignment.yml'
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Prepare isolated baseline dependencies and pinned evidence
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2
          git clone --no-hardlinks . "$RUNNER_TEMP/sal-evidence"
          git -C "$RUNNER_TEMP/sal-evidence" checkout --detach 5539de5753092b09fd78351095292e7627047794
      - name: Verify supplied baseline without historical campaign execution
        working-directory: studies/property-alignment-v1
        run: |
          export SAL_EVIDENCE_ROOT="$RUNNER_TEMP/sal-evidence"
          export OPENBLAS_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1
          python run.py audit
          python run.py diagnostics
          python run.py test
          python -m pytest tests
          python -m causal.execute verify
          python -m causal.verify_records --execution causal/recorded_execution
          python -m adjudication.validate --output "$RUNNER_TEMP/adjudication-validation"
          python run.py verify --group audit
          python run.py verify --group diagnostics
          git -C "$SAL_EVIDENCE_ROOT" diff --exit-code
