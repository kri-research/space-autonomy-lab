name: Verify published v0.1.0

# The publication task is retired. This workflow has no release-writing capability.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify existing tag and published release identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/verify_published_release.py
