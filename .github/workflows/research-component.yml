name: Research component
on:
  pull_request:
    paths:
      - 'studies/information-aware-assurance-v1/**'
      - 'studies/README.md'
      - '.github/workflows/research-component.yml'
  push:
    branches: [main]
    paths:
      - 'studies/information-aware-assurance-v1/**'
      - 'studies/README.md'
      - '.github/workflows/research-component.yml'
permissions:
  contents: read
jobs:
  sa06:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'
      - name: Preserve historical records
        run: |
          python tools/check_release_preservation.py
          python tools/verify_historical_snapshots.py
      - name: Install pinned build and test tools
        run: python -m pip install --require-hashes -r studies/information-aware-assurance-v1/sa06/requirements-build.lock
      - name: Check package and source-bound evidence
        working-directory: studies/information-aware-assurance-v1
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m ruff check sa06 sa06_tests
          python -m ruff format --check sa06 sa06_tests
          python -m pytest -c pyproject.toml --confcutdir=. sa06_tests
          python -m sa06.verify
          python sa06/assemble.py --output "$RUNNER_TEMP/sa06-source"
          export SOURCE_DATE_EPOCH=$(cat "$RUNNER_TEMP/sa06-source/BUILD_EPOCH")
          python -m build --no-isolation --outdir "$RUNNER_TEMP/sa06-dist" "$RUNNER_TEMP/sa06-source"
          python -m venv "$RUNNER_TEMP/sa06-use"
          "$RUNNER_TEMP/sa06-use/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/sa06-dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sa06-use/bin/python" -I -m kri_assurance_eval.cli example
          "$RUNNER_TEMP/sa06-use/bin/python" -I "$RUNNER_TEMP/sa06-source/examples/controller_adapter.py"
      - name: Check working tree
        run: git diff --exit-code
