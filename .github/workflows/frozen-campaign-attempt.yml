name: Frozen campaign attempt preservation
on:
  pull_request:
    paths:
      - 'studies/property-alignment-v1/campaign_v1/**'
      - '.github/workflows/frozen-campaign-attempt.yml'
permissions:
  contents: read
jobs:
  attempt-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Prepare pinned artifact environment
        run: |
          python -m pip install -r studies/property-alignment-v1/protective/requirements.txt
          python -m pip install ruff==0.14.11
          git clone --no-hardlinks . "$RUNNER_TEMP/sal-evidence"
          git -C "$RUNNER_TEMP/sal-evidence" checkout --detach 5539de5753092b09fd78351095292e7627047794
      - name: Audit preserved failure without rerunning protected cases
        working-directory: studies/property-alignment-v1
        run: |
          export SAL_EVIDENCE_ROOT="$RUNNER_TEMP/sal-evidence"
          export OPENBLAS_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1
          python -m ruff check campaign_v1
          python -m pytest -q -c pyproject.toml --confcutdir=. campaign_v1/tests
          python -m campaign_v1.attempt campaign_v1/recorded_attempt
          python -m evaluation.verify --freeze evaluation/frozen/freeze.json
          git -C "$SAL_EVIDENCE_ROOT" diff --exit-code
