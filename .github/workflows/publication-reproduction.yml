name: Publication artifact checks
on:
  pull_request:
    paths:
      - 'README.md'
      - 'studies/README.md'
      - 'docs/research-reproduction.md'
      - 'studies/property-alignment-v1/publication_v1/**'
      - '.github/workflows/publication-reproduction.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'studies/README.md'
      - 'docs/research-reproduction.md'
      - 'studies/property-alignment-v1/publication_v1/**'
      - '.github/workflows/publication-reproduction.yml'
permissions:
  contents: read
jobs:
  publication-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install isolated research dependencies
        run: |
          python -m pip install -r studies/property-alignment-v1/publication_v1/requirements.txt
          git clone --no-hardlinks . "$RUNNER_TEMP/sal-evidence"
          git -C "$RUNNER_TEMP/sal-evidence" checkout --detach 5539de5753092b09fd78351095292e7627047794
      - name: Preserve current scientific files and prepare their pinned snapshot
        run: |
          git diff --exit-code --diff-filter=CDMRTUXB b2ff0cc3e0c5c0a524d248fa62d0f8ffc24d65b8 -- studies/property-alignment-v1
          git clone --no-hardlinks . "$RUNNER_TEMP/sal-scientific"
          git -C "$RUNNER_TEMP/sal-scientific" checkout --detach b2ff0cc3e0c5c0a524d248fa62d0f8ffc24d65b8
          test ! -e "$RUNNER_TEMP/sal-scientific/studies/property-alignment-v1/publication_v1"
          cp -R studies/property-alignment-v1/publication_v1 "$RUNNER_TEMP/sal-scientific/studies/property-alignment-v1/"
      - name: Verify preserved source, records and adversarial fixtures
        working-directory: ${{ runner.temp }}/sal-scientific/studies/property-alignment-v1
        run: |
          export SAL_EVIDENCE_ROOT="$RUNNER_TEMP/sal-evidence" OPENBLAS_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1
          python -m ruff check publication_v1
          python -m publication_v1.audit
          python -m publication_v1.verify_recorded
          python -m pytest publication_v1/tests
          python -m publication_v1.reproduce --output "$RUNNER_TEMP/publication-check"
          git diff --exit-code
          git -C "$SAL_EVIDENCE_ROOT" diff --exit-code
          git -C "$GITHUB_WORKSPACE" diff --exit-code
