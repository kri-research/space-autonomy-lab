name: Publication artifact checks
on:
  pull_request:
    paths:
      - 'studies/property-alignment-v1/publication_v1/**'
      - '.github/workflows/publication-reproduction.yml'
permissions:
  contents: read
jobs:
  publication-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install isolated research dependencies
        run: |
          python -m pip install -r studies/property-alignment-v1/publication_v1/requirements.txt
          git clone --no-hardlinks . "$RUNNER_TEMP/sal-evidence"
          git -C "$RUNNER_TEMP/sal-evidence" checkout --detach 5539de5753092b09fd78351095292e7627047794
      - name: Verify preserved source, records and adversarial fixtures
        working-directory: studies/property-alignment-v1
        run: |
          export SAL_EVIDENCE_ROOT="$RUNNER_TEMP/sal-evidence" OPENBLAS_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1
          python -m ruff check publication_v1
          python -m publication_v1.audit
          python -m pytest publication_v1/tests
          python -m publication_v1.reproduce --output "$RUNNER_TEMP/publication-check"
          git diff --exit-code
          git -C "$SAL_EVIDENCE_ROOT" diff --exit-code
