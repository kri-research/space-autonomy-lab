name: Host execution evidence
on:
  pull_request:
    paths:
      - 'studies/property-alignment-v1/execution_validation_v1/**'
      - 'studies/property-alignment-v1/host_evidence_tests/test_recorded_evidence.py'
      - '.github/workflows/host-execution-validation.yml'
permissions:
  contents: read
jobs:
  host-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install isolated validation dependencies
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 cvxpy==1.9.2 clarabel==0.11.1 ruff==0.14.11
          git clone --no-hardlinks . "$RUNNER_TEMP/sal-evidence"
          git -C "$RUNNER_TEMP/sal-evidence" checkout --detach 5539de5753092b09fd78351095292e7627047794
      - name: Test interfaces and audit recorded samples without repeating measurements
        working-directory: studies/property-alignment-v1
        run: |
          export SAL_EVIDENCE_ROOT="$RUNNER_TEMP/sal-evidence" OPENBLAS_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1
          python -m ruff check execution_validation_v1
          python -m pytest execution_validation_v1/tests
          if [ -f execution_validation_v1/recorded/manifest.json ]; then
            python -m execution_validation_v1.artifact --verify --output execution_validation_v1/recorded
            python -m pytest host_evidence_tests/test_recorded_evidence.py
          fi
          git -C "$SAL_EVIDENCE_ROOT" diff --exit-code
