name: Post-review clarification checks
on:
  pull_request:
    paths:
      - 'studies/property-alignment-v1/post_review_correction_v1/**'
      - '.github/workflows/post-review-clarifications.yml'
permissions:
  contents: read
jobs:
  post-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install test tools
        run: python -m pip install pytest==9.0.2 ruff==0.16.5
      - name: Verify fixed constructions and event endpoints
        working-directory: studies/property-alignment-v1
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m ruff check post_review_correction_v1
          python -m post_review_correction_v1.checks --verify post_review_correction_v1/recorded
          python -m pytest post_review_correction_v1/tests
          git diff --exit-code
