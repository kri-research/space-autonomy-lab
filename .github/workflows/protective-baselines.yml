name: Protective baseline validation
on:
  pull_request:
    paths:
      - 'studies/property-alignment-v1/protective/**'
      - '.github/workflows/protective-baselines.yml'
permissions:
  contents: read
jobs:
  protective-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Isolated solver dependencies and preserved evidence
        run: |
          python -m pip install -r studies/property-alignment-v1/protective/requirements.txt
          git clone --no-hardlinks . "$RUNNER_TEMP/sal-evidence"
          git -C "$RUNNER_TEMP/sal-evidence" checkout --detach 5539de5753092b09fd78351095292e7627047794
      - name: Method fixtures and read-only developmental evidence verification
        working-directory: studies/property-alignment-v1
        run: |
          export SAL_EVIDENCE_ROOT="$RUNNER_TEMP/sal-evidence"
          export OPENBLAS_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1
          python -m protective.binding
          python -m pytest -c pyproject.toml --confcutdir=. protective/tests
          python -m protective.artifact protective/recorded_tuning
          python -m protective.artifact protective/recorded_development
          git -C "$SAL_EVIDENCE_ROOT" diff --exit-code
