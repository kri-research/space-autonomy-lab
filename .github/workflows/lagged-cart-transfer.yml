name: Lagged cart transfer verification
on:
  pull_request:
    paths:
      - 'studies/property-alignment-v1/transfer_cart_v1/**'
      - '.github/workflows/lagged-cart-transfer.yml'
permissions:
  contents: read
jobs:
  transfer-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install isolated transfer dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 ruff==0.14.11
      - name: Validate without repeating protected policies
        working-directory: studies/property-alignment-v1
        run: |
          export OPENBLAS_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1
          python -m ruff check transfer_cart_v1
          python -m pytest -q transfer_cart_v1/tests
          if [ -f transfer_cart_v1/recorded/manifest.json ]; then
            python -m transfer_cart_v1.audit --verify --output transfer_cart_v1/recorded
          fi
