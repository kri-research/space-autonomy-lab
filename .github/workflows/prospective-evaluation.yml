name: Prospective evaluation
on:
  pull_request:
    paths:
      - 'studies/information-aware-assurance-v1/**'
      - 'studies/README.md'
      - '.github/workflows/prospective-evaluation.yml'
  push:
    branches: [main]
    paths:
      - 'studies/information-aware-assurance-v1/**'
      - 'studies/README.md'
      - '.github/workflows/prospective-evaluation.yml'
permissions:
  contents: read
jobs:
  sa05:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Preserve prior research
        run: |
          python tools/check_release_preservation.py
          python tools/verify_historical_snapshots.py
      - name: Install separately pinned evaluation tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r studies/information-aware-assurance-v1/sa05/requirements.lock
      - name: Check reviewed figure publication boundaries
        run: python -m pytest -p no:cacheprovider -c /dev/null --confcutdir=tools/sa05_publication_tests tools/sa05_publication_tests
      - name: Validate numerical adapter and analysis
        working-directory: studies/information-aware-assurance-v1
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m ruff check sa05 sa05_tests
          python -m ruff format --check sa05 sa05_tests
          python -m pytest -c pyproject.toml --confcutdir=. sa05_tests
          if test -f sa05/recorded/manifest.json; then
            python -m sa05.artifact verify sa05/recorded --sample
          fi
          git diff --exit-code
