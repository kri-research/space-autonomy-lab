name: Replacement campaign results
on:
  pull_request:
    paths:
      - 'studies/property-alignment-v1/campaign_v2/**'
      - '.github/workflows/replacement-campaign-results.yml'
permissions:
  contents: read
jobs:
  recorded-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Prepare isolated audit dependencies
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 cvxpy==1.9.2 clarabel==0.11.1 ruff==0.14.11
          git clone --no-hardlinks . "$RUNNER_TEMP/sal-evidence"
          git -C "$RUNNER_TEMP/sal-evidence" checkout --detach 5539de5753092b09fd78351095292e7627047794
      - name: Audit recorded results without rerunning the campaign
        working-directory: studies/property-alignment-v1
        run: |
          export SAL_EVIDENCE_ROOT="$RUNNER_TEMP/sal-evidence"
          export OPENBLAS_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1
          python -m ruff check campaign_v2
          python -m campaign_v2.artifact --verify --output campaign_v2/recorded
          python -m pytest -q campaign_v2/tests
          python -m evaluation_v2.verify --freeze evaluation_v2/frozen/freeze.json
          git -C "$SAL_EVIDENCE_ROOT" diff --exit-code
