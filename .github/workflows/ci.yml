name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - name: Materialize frozen Experiment 002 design source
        run: gzip -dc docs/experiment-002-research-plan.md.gz > ../experiment-002-research-plan.md
      - name: Run phase-appropriate tests
        shell: bash
        run: |
          if [[ -f results/experiment-004-replacement-confirmatory/result-verification.json ]]; then
            # Completed replacement confirmatory phase. Historical pre-materialization
            # absence assertions are phase-inapplicable; immutable freeze bytes remain checked.
            uv run pytest \
              --deselect=tests/test_experiment_002_confirmatory_design.py::test_seed_contract_has_exact_eight_strata_without_materialized_roots \
              --deselect=tests/test_experiment_002_confirmatory_workflow.py::test_freeze_phase_requires_partition_16_to_remain_unmaterialized \
              --deselect=tests/test_experiment_003_design.py::test_seed_contract_reserves_outcome_partitions_without_materializing_them \
              --deselect=tests/test_experiment_003_confirmatory_design.py::test_analysis_and_seed_contract_are_frozen_without_partition_32_materialization \
              --deselect=tests/test_experiment_003_confirmatory_workflow.py::test_runtime_dependencies_match_frozen_foundation_and_partition_32_is_absent \
              --deselect=tests/test_experiment_004_foundation.py::test_seed_contract_separates_all_pre_outcome_and_future_domains \
              --deselect=tests/test_experiment_004_pilot_calibration.py::test_calibration_evidence_does_not_materialize_partition_43_or_44 \
              --deselect=tests/test_experiment_004_pilot_design.py::test_exact_foundation_identity_is_anchored_and_outcome_free \
              --deselect=tests/test_experiment_004_pilot_design.py::test_partition_44_remains_reserved_unmaterialized_and_has_no_generator \
              --deselect=tests/test_experiment_004_pilot_seeds.py::test_seed_contract_freezes_counts_replay_and_disjoint_reserved_domains \
              --deselect=tests/test_experiment_004_pilot_seeds.py::test_no_reserved_output_is_created_by_design_or_tests \
              --deselect=tests/test_experiment_004_confirmatory_design.py::test_partition_44_contract_is_fixed_and_unmaterialized \
              --deselect=tests/test_experiment_004_confirmatory_seeds.py::test_generator_is_exact_freeze_gated_but_not_invoked_by_design_tests \
              --deselect=tests/test_experiment_004_confirmatory_validation.py::test_partition_44_has_no_seed_result_or_root_rows \
              --deselect=tests/test_experiment_004_replacement.py::test_replacement_preserves_science_and_reserves_fresh_partition \
              --deselect=tests/test_experiment_004_replacement.py::test_worker_policy_and_pre_freeze_validation
            uv run python -m kri_space_autonomy.experiment_004_closeout verify
          elif [[ -f experiments/004-replacement-confirmatory/freeze-manifest.json && ! -d experiments/004-replacement-confirmatory/seeds && ! -d results/experiment-004-replacement-confirmatory ]]; then
            # Partition 44 is a permanently invalid infrastructure-interrupted historical attempt.
            # Replacement partition 45 is frozen and remains prospectively unmaterialized.
            uv run pytest \
              --deselect=tests/test_experiment_002_confirmatory_design.py::test_seed_contract_has_exact_eight_strata_without_materialized_roots \
              --deselect=tests/test_experiment_002_confirmatory_workflow.py::test_freeze_phase_requires_partition_16_to_remain_unmaterialized \
              --deselect=tests/test_experiment_003_design.py::test_seed_contract_reserves_outcome_partitions_without_materializing_them \
              --deselect=tests/test_experiment_003_confirmatory_design.py::test_analysis_and_seed_contract_are_frozen_without_partition_32_materialization \
              --deselect=tests/test_experiment_003_confirmatory_workflow.py::test_runtime_dependencies_match_frozen_foundation_and_partition_32_is_absent \
              --deselect=tests/test_experiment_004_foundation.py::test_seed_contract_separates_all_pre_outcome_and_future_domains \
              --deselect=tests/test_experiment_004_pilot_calibration.py::test_calibration_evidence_does_not_materialize_partition_43_or_44 \
              --deselect=tests/test_experiment_004_pilot_design.py::test_exact_foundation_identity_is_anchored_and_outcome_free \
              --deselect=tests/test_experiment_004_pilot_design.py::test_partition_44_remains_reserved_unmaterialized_and_has_no_generator \
              --deselect=tests/test_experiment_004_pilot_seeds.py::test_seed_contract_freezes_counts_replay_and_disjoint_reserved_domains \
              --deselect=tests/test_experiment_004_pilot_seeds.py::test_no_reserved_output_is_created_by_design_or_tests \
              --deselect=tests/test_experiment_004_confirmatory_design.py::test_partition_44_contract_is_fixed_and_unmaterialized \
              --deselect=tests/test_experiment_004_confirmatory_seeds.py::test_generator_is_exact_freeze_gated_but_not_invoked_by_design_tests \
              --deselect=tests/test_experiment_004_confirmatory_validation.py::test_partition_44_has_no_seed_result_or_root_rows
            uv run python - <<'PY'
          from pathlib import Path
          from kri_space_autonomy.experiment_004_replacement.workflow import (
              verify_freeze, verify_invalid_attempt, partition_45_unmaterialized
          )
          root = Path.cwd()
          invalid = verify_invalid_attempt(root)
          assert invalid["passed"], invalid
          frozen = verify_freeze(root, require_unmaterialized=True)
          assert frozen["passed"], frozen
          assert frozen["status"] == "READY_FOR_FRESH_PARALLEL_CONFIRMATORY_EXECUTION"
          assert partition_45_unmaterialized(root)["passed"]
          print("replacement partition 45 pre-outcome verification passed")
          PY
          elif [[ -f experiments/004-confirmatory/freeze-manifest.json && ! -d experiments/004-confirmatory/seeds && ! -d results/experiment-004-confirmatory ]]; then
            # Experiment 004 confirmatory design is frozen but partition 44 is untouched.
            # Historical absence guards are replaced by exact completed-chain verification.
            uv run pytest \
              --deselect=tests/test_experiment_002_confirmatory_design.py::test_seed_contract_has_exact_eight_strata_without_materialized_roots \
              --deselect=tests/test_experiment_002_confirmatory_workflow.py::test_freeze_phase_requires_partition_16_to_remain_unmaterialized \
              --deselect=tests/test_experiment_003_design.py::test_seed_contract_reserves_outcome_partitions_without_materializing_them \
              --deselect=tests/test_experiment_003_confirmatory_design.py::test_analysis_and_seed_contract_are_frozen_without_partition_32_materialization \
              --deselect=tests/test_experiment_003_confirmatory_workflow.py::test_runtime_dependencies_match_frozen_foundation_and_partition_32_is_absent \
              --deselect=tests/test_experiment_004_foundation.py::test_seed_contract_separates_all_pre_outcome_and_future_domains \
              --deselect=tests/test_experiment_004_pilot_calibration.py::test_calibration_evidence_does_not_materialize_partition_43_or_44 \
              --deselect=tests/test_experiment_004_pilot_design.py::test_exact_foundation_identity_is_anchored_and_outcome_free \
              --deselect=tests/test_experiment_004_pilot_design.py::test_partition_44_remains_reserved_unmaterialized_and_has_no_generator \
              --deselect=tests/test_experiment_004_pilot_seeds.py::test_seed_contract_freezes_counts_replay_and_disjoint_reserved_domains \
              --deselect=tests/test_experiment_004_pilot_seeds.py::test_no_reserved_output_is_created_by_design_or_tests
            # The design freeze records a full local fail-closed scientific validation.
            # GitHub checkout is shallow, so re-check immutable hashes/artifacts here without
            # re-running history-dependent git-diff verifiers that require old commit objects.
            uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from kri_space_autonomy.experiment_004_confirmatory.workflow import verify_freeze

          root = Path.cwd()
          frozen = verify_freeze(root, require_unmaterialized=True, recompute_science=False)
          assert frozen["passed"], frozen
          assert frozen["status"] == "READY_FOR_CONFIRMATORY_EXECUTION"
          assert frozen["partition_44"]["passed"] is True

          # Independently bind the completed Experiment 004 pilot chain to its immutable
          # artifacts without depending on Git history that is unavailable in shallow CI.
          result = root / "results/experiment-004-pilot"
          seeds = root / "experiments/004-pilot/seeds"
          digest = lambda path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
          qc = json.loads((result / "qc.json").read_text())
          analysis = json.loads((result / "analysis.json").read_text())
          reproducibility = json.loads((result / "reproducibility.json").read_text())
          execution = json.loads((result / "execution-summary.json").read_text())
          ledger = json.loads((result / "execution-ledger.json").read_text())
          index = json.loads((seeds / "index.json").read_text())
          manifest = json.loads((result / "manifest.json").read_text())

          assert qc["overall_passed"] is True
          assert all(check["passed"] for check in qc["checks"].values())
          assert analysis["progression"]["decision"] == "pilot_design_gates_passed"
          assert reproducibility["passed"] is True
          replay = reproducibility["same_platform_replay"]
          assert replay["passed"] is True and replay["blocks"] == 11 and replay["episodes"] == 22
          assert replay["original_digest"] == replay["replay_digest"]
          assert execution["blocks"] == 44 and execution["episodes"] == 88
          assert digest(result / "pilot-episodes.jsonl") == execution["episodes_sha256"]
          assert ledger["materializer_successful_invocations_observed"] == 1
          assert ledger["pilot_runner_invocations_observed"] == 1
          assert ledger["prespecified_replay_invocations_observed"] == 1
          assert ledger["retries_observed"] == 0 and ledger["replacement_roots_observed"] == 0
          assert index["partition_code"] == 43 and index["root_rows"] == 44
          assert index["planned_episode_rows"] == 88

          for entry in manifest["artifacts"]:
              path = root / entry["path"]
              assert path.is_file() and digest(path) == entry["sha256"], entry["path"]
          for line in (result / "checksums.sha256").read_text().splitlines():
              expected, name = line.split("  ", 1)
              assert digest(result / name) == expected, name
          for freeze_path in (
              root / "experiments/004/freeze-manifest.json",
              root / "experiments/004-pilot/freeze-manifest.json",
          ):
              prior = json.loads(freeze_path.read_text())
              for relative, expected in prior["source_file_hashes"].items():
                  assert digest(root / relative) == expected, relative

          assert not (root / "experiments/004-confirmatory/seeds").exists()
          assert not (root / "results/experiment-004-confirmatory").exists()
          print(json.dumps({"passed": True, "phase": "pre-partition-44 shallow-safe verification"}, sort_keys=True))
          PY
          elif [[ -d experiments/004-pilot/seeds && -d results/experiment-004-pilot ]]; then
            # Experiment 004 partition 43 has executed. Pre-materialization absence
            # assertions are intentionally phase-inapplicable; frozen source is unchanged.
            uv run pytest \
              --deselect=tests/test_experiment_002_confirmatory_design.py::test_seed_contract_has_exact_eight_strata_without_materialized_roots \
              --deselect=tests/test_experiment_002_confirmatory_workflow.py::test_freeze_phase_requires_partition_16_to_remain_unmaterialized \
              --deselect=tests/test_experiment_003_design.py::test_seed_contract_reserves_outcome_partitions_without_materializing_them \
              --deselect=tests/test_experiment_003_confirmatory_design.py::test_analysis_and_seed_contract_are_frozen_without_partition_32_materialization \
              --deselect=tests/test_experiment_003_confirmatory_workflow.py::test_runtime_dependencies_match_frozen_foundation_and_partition_32_is_absent \
              --deselect=tests/test_experiment_004_foundation.py::test_seed_contract_separates_all_pre_outcome_and_future_domains \
              --deselect=tests/test_experiment_004_pilot_calibration.py::test_calibration_evidence_does_not_materialize_partition_43_or_44 \
              --deselect=tests/test_experiment_004_pilot_design.py::test_exact_foundation_identity_is_anchored_and_outcome_free \
              --deselect=tests/test_experiment_004_pilot_seeds.py::test_seed_contract_freezes_counts_replay_and_disjoint_reserved_domains \
              --deselect=tests/test_experiment_004_pilot_seeds.py::test_no_reserved_output_is_created_by_design_or_tests
            uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          result = root / "results/experiment-004-pilot"
          seeds = root / "experiments/004-pilot/seeds"
          digest = lambda path: hashlib.sha256(Path(path).read_bytes()).hexdigest()

          qc = json.loads((result / "qc.json").read_text())
          analysis = json.loads((result / "analysis.json").read_text())
          reproducibility = json.loads((result / "reproducibility.json").read_text())
          execution = json.loads((result / "execution-summary.json").read_text())
          ledger = json.loads((result / "execution-ledger.json").read_text())
          index = json.loads((seeds / "index.json").read_text())
          manifest = json.loads((result / "manifest.json").read_text())

          assert qc["overall_passed"] is True
          assert all(check["passed"] for check in qc["checks"].values())
          assert analysis["progression"]["decision"] == "pilot_design_gates_passed"
          assert reproducibility["passed"] is True
          replay = reproducibility["same_platform_replay"]
          assert replay["passed"] is True and replay["blocks"] == 11 and replay["episodes"] == 22
          assert replay["original_digest"] == replay["replay_digest"]
          assert execution["blocks"] == 44 and execution["episodes"] == 88
          assert digest(result / "pilot-episodes.jsonl") == execution["episodes_sha256"]
          assert ledger["materializer_successful_invocations_observed"] == 1
          assert ledger["pilot_runner_invocations_observed"] == 1
          assert ledger["prespecified_replay_invocations_observed"] == 1
          assert ledger["retries_observed"] == 0 and ledger["replacement_roots_observed"] == 0
          assert index["partition_code"] == 43 and index["root_rows"] == 44
          assert index["planned_episode_rows"] == 88
          assert index["design_freeze_id"] == "8f0867a4eaa34c3fb1aef1d8fff62fb579e3099391c5c722b87a3dc6b0746079"
          assert not (root / "experiments/004-confirmatory").exists()
          assert not (root / "results/experiment-004-confirmatory").exists()

          for entry in manifest["artifacts"]:
              path = root / entry["path"]
              assert path.is_file() and digest(path) == entry["sha256"], entry["path"]
          for line in (result / "checksums.sha256").read_text().splitlines():
              expected, name = line.split("  ", 1)
              assert digest(result / name) == expected, name
          for freeze_path in (
              root / "experiments/004/freeze-manifest.json",
              root / "experiments/004-pilot/freeze-manifest.json",
          ):
              freeze = json.loads(freeze_path.read_text())
              for relative, expected in freeze["source_file_hashes"].items():
                  assert digest(root / relative) == expected, relative
          print(json.dumps({"passed": True, "phase": "post-partition-43 artifact verification"}, sort_keys=True))
          PY
            uv run python -m kri_space_autonomy.experiment_004_pilot.workflow release-scan
          elif [[ -d experiments/003-confirmatory/seeds && -d results/experiment-003-confirmatory ]]; then
            # These guards are pre-materialization assertions and are intentionally
            # false after their corresponding frozen outcome partitions execute.
            uv run pytest \
              --deselect=tests/test_experiment_002_confirmatory_design.py::test_seed_contract_has_exact_eight_strata_without_materialized_roots \
              --deselect=tests/test_experiment_002_confirmatory_workflow.py::test_freeze_phase_requires_partition_16_to_remain_unmaterialized \
              --deselect=tests/test_experiment_003_design.py::test_seed_contract_reserves_outcome_partitions_without_materializing_them \
              --deselect=tests/test_experiment_003_confirmatory_design.py::test_analysis_and_seed_contract_are_frozen_without_partition_32_materialization \
              --deselect=tests/test_experiment_003_confirmatory_workflow.py::test_runtime_dependencies_match_frozen_foundation_and_partition_32_is_absent
            # Full result verification includes exact partition-32 scenario rederivation.
            # NumPy's floating distribution transforms are not a cross-platform bitwise
            # contract, so allow only that one mismatch on a different OS/architecture,
            # while independently enforcing every stored hash, count and same-platform replay.
            uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from kri_space_autonomy.experiment_003_confirmatory.workflow import (
              dependency_runtime_identity,
              verify_results,
          )

          root = Path.cwd()
          result = verify_results(root)
          if not result["passed"]:
              runtime = dependency_runtime_identity(root)
              seed = result.get("seed_validation", {})
              allowed_cross_platform = (
                  result.get("errors_preview") == ["seed_validation"]
                  and seed.get("errors_preview") == ["deterministic_rederivation"]
                  and not runtime.get("mismatches")
                  and bool(runtime.get("platform_mismatches"))
              )
              assert allowed_cross_platform, result

              freeze = json.loads(Path("experiments/003-confirmatory/freeze-manifest.json").read_text())
              index = json.loads(Path("experiments/003-confirmatory/seeds/index.json").read_text())
              execution = json.loads(Path("results/experiment-003-confirmatory/execution-summary.json").read_text())
              qc = json.loads(Path("results/experiment-003-confirmatory/qc.json").read_text())
              reproducibility = json.loads(Path("results/experiment-003-confirmatory/reproducibility.json").read_text())
              run = json.loads(Path("results/experiment-003-confirmatory/run-manifest.json").read_text())

              digest = lambda path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert execution["freeze_id"] == freeze["freeze_id"] == run["freeze_id"]
              assert execution["passed"] is True
              assert execution["blocks"] == 5250 and execution["episodes"] == 21000
              assert execution["campaign_executions"] == 1
              assert qc["overall_passed"] is True
              assert reproducibility["passed"] is True
              replay = reproducibility["checks"]["same_platform_replay"]
              assert replay["passed"] is True and replay["episodes_checked"] == 840 and replay["mismatches"] == 0
              source_seed = reproducibility["checks"]["seed_validation"]
              assert source_seed["passed"] is True and source_seed["deterministic_rederivation_errors"] == 0
              assert index["root_rows"] == 5250 and index["planned_episode_rows"] == 21000
              assert index["replay_root_rows"] == 210 and index["replay_episode_rows"] == 840
              assert digest("experiments/003-confirmatory/seeds/confirmatory.jsonl") == index["manifest_sha256"] == run["seed_manifest_sha256"]
              assert digest("experiments/003-confirmatory/seeds/replay-subset.json") == index["replay_subset_sha256"]
              for relative, expected in freeze["source_file_hashes"].items():
                  assert digest(relative) == expected, relative
              for relative, expected in run["output_hashes"].items():
                  assert digest(relative) == expected, relative
              print(json.dumps({
                  "passed": True,
                  "mode": "cross-platform hash/replay verification",
                  "platform_mismatches": runtime["platform_mismatches"],
                  "source_platform_seed_rederivation_errors": 0,
              }, sort_keys=True))
          else:
              print(json.dumps(result, sort_keys=True))
          PY
            uv run python -m kri_space_autonomy.experiment_003_confirmatory.workflow release-scan
            uv run python -m kri_space_autonomy.experiment_003.workflow verify-results
            uv run python -m kri_space_autonomy.experiment_003.workflow release-scan
            make confirmatory-verify-freeze
            make confirmatory-verify-results
            make confirmatory-scan
          elif [[ -d experiments/003/seeds && -d results/experiment-003 ]]; then
            # These guards assert that outcome partitions have not yet been materialized.
            # They are intentionally false after the corresponding frozen campaigns run.
            uv run pytest \
              --deselect=tests/test_experiment_002_confirmatory_design.py::test_seed_contract_has_exact_eight_strata_without_materialized_roots \
              --deselect=tests/test_experiment_002_confirmatory_workflow.py::test_freeze_phase_requires_partition_16_to_remain_unmaterialized \
              --deselect=tests/test_experiment_003_design.py::test_seed_contract_reserves_outcome_partitions_without_materializing_them
            uv run python -m kri_space_autonomy.experiment_003.workflow verify-results
            uv run python -m kri_space_autonomy.experiment_003.workflow release-scan
            make confirmatory-verify-freeze
            make confirmatory-verify-results
            make confirmatory-scan
          elif [[ -d experiments/002-confirmatory/seeds && -d results/experiment-002-confirmatory ]]; then
            # These two tests are pre-materialization guards and are intentionally
            # false once the frozen confirmatory partition has been executed.
            uv run pytest \
              --deselect=tests/test_experiment_002_confirmatory_design.py::test_seed_contract_has_exact_eight_strata_without_materialized_roots \
              --deselect=tests/test_experiment_002_confirmatory_workflow.py::test_freeze_phase_requires_partition_16_to_remain_unmaterialized
            make confirmatory-verify-freeze
            make confirmatory-verify-results
            make confirmatory-scan
          else
            uv run pytest
          fi
