name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - name: Materialize frozen Experiment 002 design source
        run: gzip -dc docs/experiment-002-research-plan.md.gz > ../experiment-002-research-plan.md
      - name: Run phase-appropriate tests
        shell: bash
        run: |
          if [[ -d experiments/003-confirmatory/seeds && -d results/experiment-003-confirmatory ]]; then
            # These guards are pre-materialization assertions and are intentionally
            # false after their corresponding frozen outcome partitions execute.
            uv run pytest \
              --deselect=tests/test_experiment_002_confirmatory_design.py::test_seed_contract_has_exact_eight_strata_without_materialized_roots \
              --deselect=tests/test_experiment_002_confirmatory_workflow.py::test_freeze_phase_requires_partition_16_to_remain_unmaterialized \
              --deselect=tests/test_experiment_003_design.py::test_seed_contract_reserves_outcome_partitions_without_materializing_them \
              --deselect=tests/test_experiment_003_confirmatory_design.py::test_analysis_and_seed_contract_are_frozen_without_partition_32_materialization \
              --deselect=tests/test_experiment_003_confirmatory_workflow.py::test_runtime_dependencies_match_frozen_foundation_and_partition_32_is_absent
            uv run python -m kri_space_autonomy.experiment_003_confirmatory.workflow verify-results
            uv run python -m kri_space_autonomy.experiment_003_confirmatory.workflow release-scan
            uv run python -m kri_space_autonomy.experiment_003.workflow verify-results
            uv run python -m kri_space_autonomy.experiment_003.workflow release-scan
            make confirmatory-verify-freeze
            make confirmatory-verify-results
            make confirmatory-scan
          elif [[ -d experiments/003/seeds && -d results/experiment-003 ]]; then
            # These guards assert that outcome partitions have not yet been materialized.
            # They are intentionally false after the corresponding frozen campaigns run.
            uv run pytest \
              --deselect=tests/test_experiment_002_confirmatory_design.py::test_seed_contract_has_exact_eight_strata_without_materialized_roots \
              --deselect=tests/test_experiment_002_confirmatory_workflow.py::test_freeze_phase_requires_partition_16_to_remain_unmaterialized \
              --deselect=tests/test_experiment_003_design.py::test_seed_contract_reserves_outcome_partitions_without_materializing_them
            uv run python -m kri_space_autonomy.experiment_003.workflow verify-results
            uv run python -m kri_space_autonomy.experiment_003.workflow release-scan
            make confirmatory-verify-freeze
            make confirmatory-verify-results
            make confirmatory-scan
          elif [[ -d experiments/002-confirmatory/seeds && -d results/experiment-002-confirmatory ]]; then
            # These two tests are pre-materialization guards and are intentionally
            # false once the frozen confirmatory partition has been executed.
            uv run pytest \
              --deselect=tests/test_experiment_002_confirmatory_design.py::test_seed_contract_has_exact_eight_strata_without_materialized_roots \
              --deselect=tests/test_experiment_002_confirmatory_workflow.py::test_freeze_phase_requires_partition_16_to_remain_unmaterialized
            make confirmatory-verify-freeze
            make confirmatory-verify-results
            make confirmatory-scan
          else
            uv run pytest
          fi
