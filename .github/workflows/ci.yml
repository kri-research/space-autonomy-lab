name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.5"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: ".python-version"
      - name: Verify published snapshot preservation before installation
        run: python tools/check_release_preservation.py
      - run: uv sync --frozen --extra dev
      - name: Validate citation schema
        run: uvx --python 3.11.16 --from cffconvert==2.0.0 cffconvert --validate
      - name: Run maintained post-release checks
        run: uv run python tools/run_post_release_checks.py
