name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - name: Materialize frozen Experiment 002 design source
        run: gzip -dc docs/experiment-002-research-plan.md.gz > ../experiment-002-research-plan.md
      - name: Run phase-appropriate tests
        shell: bash
        run: |
          if [[ -d experiments/003-confirmatory/seeds && -d results/experiment-003-confirmatory ]]; then
            # These guards are pre-materialization assertions and are intentionally
            # false after their corresponding frozen outcome partitions execute.
            uv run pytest \
              --deselect=tests/test_experiment_002_confirmatory_design.py::test_seed_contract_has_exact_eight_strata_without_materialized_roots \
              --deselect=tests/test_experiment_002_confirmatory_workflow.py::test_freeze_phase_requires_partition_16_to_remain_unmaterialized \
              --deselect=tests/test_experiment_003_design.py::test_seed_contract_reserves_outcome_partitions_without_materializing_them \
              --deselect=tests/test_experiment_003_confirmatory_design.py::test_analysis_and_seed_contract_are_frozen_without_partition_32_materialization \
              --deselect=tests/test_experiment_003_confirmatory_workflow.py::test_runtime_dependencies_match_frozen_foundation_and_partition_32_is_absent
            # Full result verification includes exact partition-32 scenario rederivation.
            # NumPy's floating distribution transforms are not a cross-platform bitwise
            # contract, so allow only that one mismatch on a different OS/architecture,
            # while independently enforcing every stored hash, count and same-platform replay.
            uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from kri_space_autonomy.experiment_003_confirmatory.workflow import (
              dependency_runtime_identity,
              verify_results,
          )

          root = Path.cwd()
          result = verify_results(root)
          if not result["passed"]:
              runtime = dependency_runtime_identity(root)
              seed = result.get("seed_validation", {})
              allowed_cross_platform = (
                  result.get("errors_preview") == ["seed_validation"]
                  and seed.get("errors_preview") == ["deterministic_rederivation"]
                  and not runtime.get("mismatches")
                  and bool(runtime.get("platform_mismatches"))
              )
              assert allowed_cross_platform, result

              freeze = json.loads(Path("experiments/003-confirmatory/freeze-manifest.json").read_text())
              index = json.loads(Path("experiments/003-confirmatory/seeds/index.json").read_text())
              execution = json.loads(Path("results/experiment-003-confirmatory/execution-summary.json").read_text())
              qc = json.loads(Path("results/experiment-003-confirmatory/qc.json").read_text())
              reproducibility = json.loads(Path("results/experiment-003-confirmatory/reproducibility.json").read_text())
              run = json.loads(Path("results/experiment-003-confirmatory/run-manifest.json").read_text())

              digest = lambda path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert execution["freeze_id"] == freeze["freeze_id"] == run["freeze_id"]
              assert execution["passed"] is True
              assert execution["blocks"] == 5250 and execution["episodes"] == 21000
              assert execution["campaign_executions"] == 1
              assert qc["overall_passed"] is True
              assert reproducibility["passed"] is True
              replay = reproducibility["checks"]["same_platform_replay"]
              assert replay["passed"] is True and replay["episodes_checked"] == 840 and replay["mismatches"] == 0
              source_seed = reproducibility["checks"]["seed_validation"]
              assert source_seed["passed"] is True and source_seed["deterministic_rederivation_errors"] == 0
              assert index["root_rows"] == 5250 and index["planned_episode_rows"] == 21000
              assert index["replay_root_rows"] == 210 and index["replay_episode_rows"] == 840
              assert digest("experiments/003-confirmatory/seeds/confirmatory.jsonl") == index["manifest_sha256"] == run["seed_manifest_sha256"]
              assert digest("experiments/003-confirmatory/seeds/replay-subset.json") == index["replay_subset_sha256"]
              for relative, expected in freeze["source_file_hashes"].items():
                  assert digest(relative) == expected, relative
              for relative, expected in run["output_hashes"].items():
                  assert digest(relative) == expected, relative
              print(json.dumps({
                  "passed": True,
                  "mode": "cross-platform hash/replay verification",
                  "platform_mismatches": runtime["platform_mismatches"],
                  "source_platform_seed_rederivation_errors": 0,
              }, sort_keys=True))
          else:
              print(json.dumps(result, sort_keys=True))
          PY
            uv run python -m kri_space_autonomy.experiment_003_confirmatory.workflow release-scan
            uv run python -m kri_space_autonomy.experiment_003.workflow verify-results
            uv run python -m kri_space_autonomy.experiment_003.workflow release-scan
            make confirmatory-verify-freeze
            make confirmatory-verify-results
            make confirmatory-scan
          elif [[ -d experiments/003/seeds && -d results/experiment-003 ]]; then
            # These guards assert that outcome partitions have not yet been materialized.
            # They are intentionally false after the corresponding frozen campaigns run.
            uv run pytest \
              --deselect=tests/test_experiment_002_confirmatory_design.py::test_seed_contract_has_exact_eight_strata_without_materialized_roots \
              --deselect=tests/test_experiment_002_confirmatory_workflow.py::test_freeze_phase_requires_partition_16_to_remain_unmaterialized \
              --deselect=tests/test_experiment_003_design.py::test_seed_contract_reserves_outcome_partitions_without_materializing_them
            uv run python -m kri_space_autonomy.experiment_003.workflow verify-results
            uv run python -m kri_space_autonomy.experiment_003.workflow release-scan
            make confirmatory-verify-freeze
            make confirmatory-verify-results
            make confirmatory-scan
          elif [[ -d experiments/002-confirmatory/seeds && -d results/experiment-002-confirmatory ]]; then
            # These two tests are pre-materialization guards and are intentionally
            # false once the frozen confirmatory partition has been executed.
            uv run pytest \
              --deselect=tests/test_experiment_002_confirmatory_design.py::test_seed_contract_has_exact_eight_strata_without_materialized_roots \
              --deselect=tests/test_experiment_002_confirmatory_workflow.py::test_freeze_phase_requires_partition_16_to_remain_unmaterialized
            make confirmatory-verify-freeze
            make confirmatory-verify-results
            make confirmatory-scan
          else
            uv run pytest
          fi
