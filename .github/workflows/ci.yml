name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - name: Materialize frozen Experiment 002 design source
        run: gzip -dc docs/experiment-002-research-plan.md.gz > ../experiment-002-research-plan.md
      - run: uv run pytest
