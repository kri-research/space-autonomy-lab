name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - name: Materialize frozen Experiment 002 design source
        run: gzip -dc docs/experiment-002-research-plan.md.gz > ../experiment-002-research-plan.md
      - name: Run post-Experiment-005 checks
        shell: bash
        run: |
          uv run pytest -q \
            tests/test_environment.py \
            tests/test_evidence.py \
            tests/test_controller_adapter.py \
            tests/test_demo.py \
            tests/test_assurance_report.py \
            tests/test_benchmark_documentation.py \
            tests/test_experiment_005_confirmatory_analysis.py \
            tests/test_experiment_005_confirmatory_closeout.py
          uv run kri-space-lab verify-gate
          uv run python -m kri_space_autonomy.experiment_004_closeout verify
          uv run python -m kri_space_autonomy.experiment_005_confirmatory.workflow release-scan
          git diff --check
