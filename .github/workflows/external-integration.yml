name: External integration protocol
on:
  pull_request:
    paths:
      - 'studies/information-aware-assurance-v1/**'
      - 'studies/README.md'
      - '.github/workflows/external-integration.yml'
  push:
    branches: [main]
    paths:
      - 'studies/information-aware-assurance-v1/**'
      - 'studies/README.md'
      - '.github/workflows/external-integration.yml'
permissions:
  contents: read
jobs:
  ev01:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'
      - name: Preserve prior release and protocol
        run: |
          python tools/check_release_preservation.py
          python tools/verify_historical_snapshots.py
      - name: Install pinned build tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r studies/information-aware-assurance-v1/sa06/requirements-build.lock
      - name: Build the unchanged component and test the external protocol
        working-directory: studies/information-aware-assurance-v1
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m ruff check ev01
          python -m ruff format --check ev01
          python -m ev01.verify
          python -m post_audit_v1.verify
          python -m post_audit_v1.assemble --output "$RUNNER_TEMP/ev01-source"
          SOURCE_DATE_EPOCH=$(cat "$RUNNER_TEMP/ev01-source/BUILD_EPOCH") python -m build --no-isolation "$RUNNER_TEMP/ev01-source" --outdir "$RUNNER_TEMP/ev01-dist"
          python -m pip install --no-deps "$RUNNER_TEMP"/ev01-dist/*.whl
          python -m pytest -c pyproject.toml --confcutdir=. ev01/tests
          python -m venv "$RUNNER_TEMP/ev01-use"
          "$RUNNER_TEMP/ev01-use/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/ev01-dist/*.whl
          STUDY="$PWD"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ev01-use/bin/python" -I "$STUDY/ev01/check.py" --output "$RUNNER_TEMP/ev01-report"
          "$RUNNER_TEMP/ev01-use/bin/python" -I "$RUNNER_TEMP/ev01-source/examples/controller_adapter.py"
