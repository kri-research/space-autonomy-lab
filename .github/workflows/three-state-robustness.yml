name: Three-state robustness evidence
on:
  pull_request:
    paths:
      - 'studies/property-alignment-v1/boundary_robustness_v1/**'
      - 'studies/property-alignment-v1/robustness_evidence_tests/**'
      - '.github/workflows/three-state-robustness.yml'
permissions:
  contents: read
jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install testing dependencies
        run: python -m pip install pytest==9.0.2 ruff==0.14.11
      - name: Test family bounds and recheck fixed sensitivity evidence
        working-directory: studies/property-alignment-v1
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python -m ruff check boundary_robustness_v1
          python -m pytest boundary_robustness_v1/tests robustness_evidence_tests
          if [ -f boundary_robustness_v1/recorded/completion.json ]; then
            ID=$(python -c "import json; print(json.load(open('boundary_robustness_v1/frozen/study.json'))['study_id'])")
            python -m boundary_robustness_v1.study verify --output boundary_robustness_v1/recorded --freeze boundary_robustness_v1/frozen/study.json --study-id "$ID" --recompute
          fi
          git diff --exit-code
