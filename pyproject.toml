[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kri-space-autonomy-lab"
version = "0.1.0"
description = "Research testbed for spacecraft autonomy under faults, uncertainty, and runtime safety constraints."
readme = "README.md"
requires-python = "==3.11.16"
license = {text = "Apache-2.0"}
authors = [{name = "KRI"}]
keywords = ["spacecraft", "autonomy", "runtime-assurance", "fault-injection", "space-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.5"]

[project.scripts]
kri-space-lab = "kri_space_autonomy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
